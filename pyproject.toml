[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-breaker"
version = "0.1.0"
description = "League of Legends match outcome prediction and tournament simulation system"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["src", "betting_app"]
