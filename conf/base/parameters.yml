# Simulation Pipeline Parameters (Kedro-Style Parameters Registry)

simulation:
  benchmark:
    bootstrap_draws: 5000
    random_seed: 20260915
    tail_loss_threshold: 2.5
    ece_bins: 10

  shrinkage:
    alphas: [0.0, 0.25, 0.35, 0.50, 0.75, 1.0]
    devig_method: "shin"

  betting:
    initial_bankroll: 10000.0
    tax_rate_pl: 0.12
    tax_rate_intl: 0.00
    model_shrinkage_weight: 0.50          # alpha: 50% sports model logit + 50% Shin market logit
    alpha: 0.50
    market_divergence_logit_max: 0.85     # Market-Divergence-Gate (formerly Guard B): |logit(p_model) - logit(q_market)| <= 0.85
    guard_b_logit_threshold: 0.85
    model_consensus_veto_max: 0.10        # Model-Consensus-Veto (formerly Thesis Veto): |p_attention - p_elasticnet| <= 0.10
    thesis_veto_threshold: 0.10
    wasserstein_robust_ambiguity_radius: 0.025 # Wasserstein-Robust-Gate (formerly Guard W): epsilon = 0.025
    guard_w_epsilon: 0.025
    min_ev: 0.05
    max_ev: 0.25
    max_odds: 4.00
    kelly_fraction: 0.25
    max_stake_pln: 150.0
    min_stake_pln: 20.0
    flat_stake_pln: 100.0
  econometrics:
    bootstrap_draws: 10000
    random_seed: 20261014
    noise_decay_sample_sizes: [10, 20, 50, 100, 250, 500, 1000, 1396, 2000, 2792]
    confidence_z_95_one_sided: 1.6448536269514722
